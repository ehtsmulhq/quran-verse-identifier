<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e26"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#021a15"/>
    </linearGradient>

    <!-- Emerald Green Gradient for Quran Left Wing -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Sky Blue Gradient for Quran Right Wing -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Acoustic Audio Wave Lines / Equalizer Bars -->
  <g stroke-linecap="round" filter="url(#glow)">
    <!-- Bar 1 (Outer Left) -->
    <line x1="34" y1="44" x2="34" y2="58" stroke="#38bdf8" stroke-width="3.5" opacity="0.75" />
    <!-- Bar 2 (Mid Left) -->
    <line x1="44" y1="34" x2="44" y2="60" stroke="#38bdf8" stroke-width="4" opacity="0.9" />
    <!-- Bar 3 (Inner Left) -->
    <line x1="54" y1="24" x2="54" y2="62" stroke="#10b981" stroke-width="4.5" />
    <!-- Bar 4 (Center Peak) -->
    <line x1="64" y1="16" x2="64" y2="64" stroke="#34d399" stroke-width="5" />
    <!-- Bar 5 (Inner Right) -->
    <line x1="74" y1="24" x2="74" y2="62" stroke="#10b981" stroke-width="4.5" />
    <!-- Bar 6 (Mid Right) -->
    <line x1="84" y1="34" x2="84" y2="60" stroke="#38bdf8" stroke-width="4" opacity="0.9" />
    <!-- Bar 7 (Outer Right) -->
    <line x1="94" y1="44" x2="94" y2="58" stroke="#38bdf8" stroke-width="3.5" opacity="0.75" />
  </g>

  <!-- Open Quran Book Pages -->
  <!-- Left Page (Emerald Green) -->
  <path d="M 64 74 C 54 67, 36 67, 22 73 C 21 73.5, 20 74.5, 20 76 L 20 97 C 20 98.5, 21.5 99.5, 23 99 C 36 93, 53 93, 64 99 Z"
        fill="url(#emeraldGrad)" />

  <!-- Left Page Verse Highlight Lines -->
  <path d="M 28 78 C 38 74, 50 74, 58 78" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 28 84 C 38 80, 50 80, 58 84" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 28 90 C 38 86, 50 86, 58 90" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Right Page (Sky Blue) -->
  <path d="M 64 74 C 74 67, 92 67, 106 73 C 107 73.5, 108 74.5, 108 76 L 108 97 C 108 98.5, 106.5 99.5, 105 99 C 92 93, 75 93, 64 99 Z"
        fill="url(#skyGrad)" />

  <!-- Right Page Verse Highlight Lines -->
  <path d="M 70 78 C 78 74, 90 74, 100 78" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 70 84 C 78 80, 90 80, 100 84" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 70 90 C 78 86, 90 86, 100 90" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Central Spine & Golden Bookmark Ribbon -->
  <path d="M 64 72 L 64 103" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="61,103 67,103 64,109" fill="#fbbf24" />
</svg>
